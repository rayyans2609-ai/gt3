<!doctype html><html><head><meta charset="utf-8"><title>car check</title>
<style>body{margin:0;background:#2a2a2e}canvas{display:block}</style></head>
<body><script type="module">
import * as THREE from 'three';
import { preloadCars, getCarModel } from '/src/scene/cars.js';
import { CARS } from '/src/data/cars.js';

const W = 620, H = 300, COLS = 2, ROWS = 5;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W * COLS, H * ROWS);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
renderer.setScissorTest(true);

await preloadCars();

// One camera, looking from BEHIND-ABOVE exactly like the race camera.
// A correctly oriented car must show its REAR (wing, diffuser) nearest the camera.
// SIDE PROFILE. Camera on +X looking toward -X, so world -Z (the direction of travel)
// appears on the RIGHT of each cell. A correctly oriented car therefore points RIGHT:
// pointed nose on the right, rear wing on the left.
const cam = new THREE.PerspectiveCamera(26, W / H, 0.1, 100);
cam.position.set(14, 2.2, 0);
cam.lookAt(0, 0.75, 0);

for (let i = 0; i < 10; i++) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2a2a2e);
  scene.add(new THREE.HemisphereLight(0xcfd8e0, 0x50442f, 2.0));
  const d = new THREE.DirectionalLight(0xffffff, 2.6); d.position.set(5, 9, 6); scene.add(d);
  const d2 = new THREE.DirectionalLight(0xffffff, 1.2); d2.position.set(-6, 5, -7); scene.add(d2);
  scene.add(getCarModel(i));
  // A marker cone at -Z: the direction of travel. It must sit at the car's NOSE.
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.0, 12),
    new THREE.MeshBasicMaterial({ color: 0xffcc33 }));
  cone.rotation.z = -Math.PI / 2; cone.position.set(0, 0.35, -3.4);
  scene.add(cone);

  const col = i % COLS, row = Math.floor(i / COLS);
  const x = col * W, y = (ROWS - 1 - row) * H;
  renderer.setViewport(x, y, W, H);
  renderer.setScissor(x, y, W, H);
  renderer.render(scene, cam);
}
window.__done = true;
console.info('[carcheck] rendered', CARS.map(c => c.id).join(','));
</script></body></html>
