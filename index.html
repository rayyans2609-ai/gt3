<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&amp;family=DM+Mono:wght@300;400;500&amp;family=DM+Sans:wght@200;300;400;500&amp;display=swap"
      rel="stylesheet"
    />
    <title>GT3: A Grand Tour</title>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="scroll-spacer"></div>
    <div id="overlay">
      <div id="start-screen"></div>
      <div id="hud">
        <div id="hud-topleft"></div>
        <div id="hud-topright"></div>
        <div id="hud-bottomleft"></div>
        <div id="hud-bottomright"></div>
        <div id="hud-routemap"></div>
        <div id="hud-approach"></div>
      </div>
      <div id="spec-panel"></div>
      <div id="tod-selector"></div>
      <div id="montage-layer"></div>
      <div id="fullscreen-card"></div>
      <div id="showcase-layer"></div>
      <div id="finish-screen"></div>
      <div id="small-screen-note">This experience is built for a desktop display.</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
