<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GT3: A Grand Tour</title>
    <script>
      // Typography comparison variant (?font=sw → Switzer); set before first paint. Default: Neue Haas.
      if (new URLSearchParams(location.search).get('font') === 'sw') document.documentElement.dataset.font = 'sw';
    </script>
    <script>
      // World and theme before first paint (SPEC §24–25): a restored Grand Tour boots straight
      // back into the Tour; everything else (a new session included) is the Landing world.
      (function () {
        var root = document.documentElement, saved = null;
        try { saved = JSON.parse(sessionStorage.getItem('gt3.session.v1') || 'null'); } catch (e) { saved = null; }
        var experience = saved && saved.experience;
        root.dataset.world = experience === 'tour' || experience === 'complete' ? 'tour' : 'landing';
        // A refresh into the Hub paints the bare field until the Hub mounts, never the Landing type.
        if (experience === 'hub' || experience === 'showcase') root.dataset.boot = 'hub';
        root.dataset.theme = saved && saved.theme === 'night' ? 'night' : 'day';
      })();
    </script>
    <script>
      // Boot input guard (SPEC §14): until scrollDrive locks the drive, scroll input made while the
      // modules load must not move the page. Removed by scrollDrive.lockScroll(); records the last
      // swallowed gesture so the post-ready unlock can wait out any in-flight momentum.
      (function () {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        var keys = { ArrowUp: 1, ArrowDown: 1, PageUp: 1, PageDown: 1, Home: 1, End: 1, ' ': 1, Spacebar: 1 };
        var guard = { lastInputAt: 0 };
        function swallow(e) { guard.lastInputAt = performance.now(); e.preventDefault(); }
        function swallowKey(e) { if (keys[e.key]) swallow(e); }
        var opts = { passive: false };
        window.addEventListener('wheel', swallow, opts);
        window.addEventListener('touchmove', swallow, opts);
        window.addEventListener('keydown', swallowKey, opts);
        guard.detach = function () {
          window.removeEventListener('wheel', swallow, opts);
          window.removeEventListener('touchmove', swallow, opts);
          window.removeEventListener('keydown', swallowKey, opts);
        };
        window.__gt3BootGuard = guard;
      })();
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="scroll-spacer"></div>
    <div id="landing-spacer"></div>
    <div id="overlay">
      <div id="landing">
        <h1 class="landing-wordmark">GT3</h1>
        <p class="landing-eyebrow">A Grand Tour</p>
        <div class="landing-cue" aria-hidden="true"><span>Scroll</span><span class="landing-cue__track"><span class="landing-cue__line"></span></span></div>
      </div>
      <div id="hub" hidden></div>
      <div id="start-screen"></div>
      <div id="hud">
        <div id="hud-topleft"></div>
        <div id="hud-topright"></div>
        <div id="hud-bottomleft"></div>
        <div id="hud-bottomright"></div>
      </div>
      <div id="montage-layer"></div>
      <div id="finish-screen"></div>
      <div id="audio-layer"></div>
      <div id="small-screen-note">This experience is built for a desktop display.</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
